version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Asia/Taipei
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      production-dependencies:
        dependency-type: production
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      development-major:
        dependency-type: development
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    groups:
      # init 與 analyze 必須跑同一個版本——拆開升會出現
      # "Loaded a configuration file for version X, but running version Y"，
      # 兩個 PR 各自都是紅的。放同一組讓它們一起升。
      codeql-action:
        patterns:
          - "github/codeql-action*"

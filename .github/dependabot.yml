version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Asia/Taipei
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      production-dependencies:
        dependency-type: production
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      development-major:
        dependency-type: development
        update-types:
          - major
    ignore:
      # React 19.3 cannot be installed: @react-three/fiber declares
      # peer react/react-dom ">=19 <19.3" and 9.7.0 has not widened it, so
      # `npm ci` fails with ERESOLVE. Without these four lines the whole
      # development-minor-and-patch group is red and the other six members
      # (three, vite, typescript-eslint, electron-builder, ...) stay behind
      # with it. The reasoning and the lift condition live in
      # .github/dependency-deferrals.json, which the freshness check reads;
      # that file also re-raises this automatically once npm's latest moves
      # past the version recorded there.
      - dependency-name: react
        versions: [">=19.3"]
      - dependency-name: react-dom
        versions: [">=19.3"]
      - dependency-name: "@types/react"
        versions: [">=19.3"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.3"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    groups:
      # init 與 analyze 必須跑同一個版本——拆開升會出現
      # "Loaded a configuration file for version X, but running version Y"，
      # 兩個 PR 各自都是紅的。放同一組讓它們一起升。
      codeql-action:
        patterns:
          - "github/codeql-action*"

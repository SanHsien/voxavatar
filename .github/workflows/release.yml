name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate release inputs
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require distributable, licensed assets
        run: npm run assets:release

      - name: Require tag to match package version
        run: node scripts/check-release-tag.cjs "${env:GITHUB_REF_NAME}"

  package:
    name: Package Windows x64
    needs: release-gate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run check

      - name: Build native installer
        run: npm run dist:windows
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: voxavatar-windows-x64
          path: |
            release/*.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download native installers
        uses: actions/download-artifact@v8
        with:
          pattern: voxavatar-*
          path: release-artifacts
          merge-multiple: true

      - name: Write SHA-256 checksums
        run: node scripts/write-checksums.cjs release-artifacts

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: VoxAvatar ${{ github.ref_name }}
          generate_release_notes: true
          # 不要因 tag 含 -beta 就標 Pre-release：GitHub 首頁 Latest 會略過，
          # 看起來像「只有 tag、沒有 Release」。beta 版號仍寫在 tag／標題裡。
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.exe
            release-artifacts/SHA256SUMS.txt
